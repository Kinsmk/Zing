<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Zinga Language Icon (compact) -->
  
  <defs>
    <!-- Gradient for the Z shape -->
    <linearGradient id="zGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- Gradient for the N shape -->
    <linearGradient id="nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
  </defs>
  
  <!-- Z Shape -->
  <path d="M20 15 L75 15 L20 40 L75 40 L20 65 L75 65 L20 15 Z"
        fill="url(#zGradient)"/>
  
  <!-- N Shape -->
  <path d="M25 15 L25 65 L45 15 L65 65 L65 15 L45 65 L25 15 Z"
        fill="url(#nGradient)" transform="translate(5, 0)"/>
</svg>
