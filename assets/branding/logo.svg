<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Zinga Language Logo -->
  <!-- Primary logo with text -->
  
  <defs>
    <!-- Gradient for the Z shape -->
    <linearGradient id="zGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    
    <!-- Gradient for the N shape -->
    <linearGradient id="nGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="8" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle (optional) -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#E5E7EB" stroke-width="1"/>
  
  <!-- Z Shape (left side) -->
  <path d="M120 80 L380 80 L120 240 L380 240 L120 400 L380 400 L120 80 Z"
        fill="url(#zGradient)" filter="url(#shadow)"/>
  
  <!-- N Shape (right side) -->
  <path d="M140 80 L140 400 L260 80 L380 400 L380 80 L260 400 L140 80 Z"
        fill="url(#nGradient)" filter="url(#shadow)" transform="translate(20, 0)"/>
  
  <!-- Text "Zinga" -->
  <text x="256" y="460" font-family="Inter, system-ui, sans-serif" 
        font-size="64" font-weight="700" text-anchor="middle" 
        fill="#1F2937" letter-spacing="2">
    Zinga
  </text>
  
  <!-- Tagline -->
  <text x="256" y="500" font-family="Inter, system-ui, sans-serif" 
        font-size="24" text-anchor="middle" 
        fill="#6B7280">
    The Bilingual Programming Language
  </text>
</svg>
